spring.application.name=sprint-service
server.port = ${PORT:9000}

server.tomcat.threads.idle-timeout=1000ms
server.tomcat.connection-timeout=1s
spring.mvc.async.request-timeout = 360000

security.basic.enable: false
security.ignored=/**
management.security.enabled=false

# MySql
spring.datasource.max-active=${MAX_DB_CONNECTIONS:4}
spring.datasource.platform=postgres
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}?serverTimezone=UTC
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

stripe.api.key=${STRIPE_API_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
# Required environment variables (never commit their values):
#   POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DATABASE, POSTGRES_USER, POSTGRES_PASSWORD
#   STRIPE_API_KEY, STRIPE_PUBLISHABLE_KEY
#   JWT_SECRET          - long random string used to sign auth tokens
#   MAIL_USERNAME       - Gmail account used to send mail
#   MAIL_PASSWORD       - Gmail app password for MAIL_USERNAME
#   NOTIFICATION_EMAIL  - address that receives internal notifications
